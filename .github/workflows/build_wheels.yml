name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: aarch64
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
      - name: Set up MSVC
        if: runner.os == 'Windows' && matrix.arch != 'aarch64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up MSVC
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Wait for docker to wake up on ARM
        if: runner.os == 'Linux' && matrix.arch == 'aarch64'
        run: while ! docker version; do sleep 1; done
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
  release_canary:
    name: Canary wheels on ${{ matrix.os }}
    needs: [build_wheels]
    if: github.ref_type == 'tag'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-ubuntu-latest-x86_64
          - os: windows-latest
            artifact: wheels-windows-latest-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse
      - name: Install wheel
        # fresh interpreter: the wheel must import without re-enabling the
        # GIL; numpy comes from the index (hard runtime dependency)
        run: pip install wheelhouse/simplejpeg-*cp314t*.whl numpy
        shell: bash
      - name: Run wheel canary
        run: python test/wheel_canary.py
        shell: bash
  upload_all:
    needs: [build_wheels, make_sdist, release_canary]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/simplejpeg
    permissions:
      contents: write
      id-token: write
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
      - name: Create Github release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: dist/*
          draft: false
          prerelease: false
