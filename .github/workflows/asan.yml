name: ASan suite

on:
  workflow_call:
  workflow_dispatch:

jobs:
  asan:
    name: ASan suite
    runs-on: ubuntu-latest
    env:
      CFLAGS: -fsanitize=address -g -O1 -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address
      # setup.py reads it: sanitizer builds keep the extension binary
      # unstripped so leak reports name our frames
      SIMPLEJPEG_SANITIZE: '1'
      # test_threads.py reads it: shrink the storm's windows under the
      # slowed-down sanitizer build
      STORM_BUDGET: 0.4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          pip install --upgrade pip
          pip install cython cmake numpy setuptools pytest rssize
      - name: Build instrumented
        # libjpeg-turbo is vendored and statically linked: CFLAGS/LDFLAGS
        # reach its cmake build, so the whole native stack is instrumented;
        # the built wheels cannot be checked this way, instrumentation is
        # a compile-time property, this one runs from the tagged source
        run: |
          set -o pipefail
          pip install --no-build-isolation --verbose . 2>&1 | tee build.log
      - name: Test suite
        # never from the repo cwd: the source tree would shadow the
        # freshly built site-packages extension.
        # the interpreter itself is not instrumented; loading the
        # instrumented extension via dlopen aborts without the preload.
        # the LD_PRELOAD assignment prefixes only the pytest command, so
        # the pipeline's tee and every helper outside it (touch/zip in
        # the log steps, the upload action's node) run un-instrumented:
        # else they abort the step at their own process exit with their
        # exit-time leak reports, each unrelated to simplejpeg (every
        # uutils binary of the runner leaks a fixed 43 KB under the
        # runtime, node leaks a 24 byte OpenSSL init block). the
        # multiarray_umath suppression keeps numpy's exit-time ufunc
        # allocations out of the way so simplejpeg leaks stand out;
        # LSan matches suppression patterns against the full module path
        # of each leaked stack frame
        run: |
          set -o pipefail
          cd ~
          printf 'leak:multiarray_umath\n' > "$RUNNER_TEMP/lsan.txt"
          LD_PRELOAD=$(gcc -print-file-name=libasan.so) \
          LSAN_OPTIONS=suppressions=$RUNNER_TEMP/lsan.txt \
          python -m pytest "$GITHUB_WORKSPACE/test" -q 2>&1 | tee test.log
      - name: Zip the logs
        # runs after failures; test.log is touched in case the build
        # failed before the tests could start
        if: always()
        run: |
          touch "$GITHUB_WORKSPACE/test.log"
          cd "$GITHUB_WORKSPACE"
          zip -j logs-asan.zip build.log test.log
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-asan
          path: logs-asan.zip
          if-no-files-found: error
